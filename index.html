            { name: "Греческий", description: "Хрустящие овощи, фета, оливки и оливковое масло первого отжима.", price: "230 ₽", imageUrl: "https://images.unsplash.com/photo-1568600891621-2b1e38c79f3a?q=80&w=1920&auto=format&fit=crop" },
            { name: "Цезарь с Курицей", description: "Фирменный соус, куриное филе, пармезан и хрустящие крутоны.", price: "260 ₽", imageUrl: "https://images.unsplash.com/photo-1546069901-eacef0df6022?q=80&w=1920&auto=format&fit=crop" },
            { name: "Овощной Хрустящий", description: "Свежие огурцы, редис, зелень и легкая сметанная заправка.", price: "190 ₽", imageUrl: "https://images.unsplash.com/photo-1550418290-a8d86ad674a3?q=80&w=1920&auto=format&fit=crop" },
            { name: "Салат с Киноа", description: "Киноа, авокадо, шпинат и цитрусовая заправка.", price: "280 ₽", imageUrl: "https://images.unsplash.com/photo-1540420773420-3366772f4999?q=80&w=1920&auto=format&fit=crop" },
            { name: "Табуле", description: "Булгур, мята, петрушка и сок лимона в освежающем миксе.", price: "220 ₽", imageUrl: "https://images.unsplash.com/photo-1569058242323-354a4d74c91a?q=80&w=1920&auto=format&fit=crop" },
            { name: "Свекла и Фета", description: "Печеная свекла, фета и карамелизированные орехи с бальзамиком.", price: "240 ₽", imageUrl: "https://images.unsplash.com/photo-1498837167922-ddd27525d352?q=80&w=1920&auto=format&fit=crop" }
          ]
        }
      ];

      const MenuHits = ({ onAddToCart }) => {
        return (
          React.createElement("section", { id: "hits", className: "py-20 bg-gray-900" },
            React.createElement("div", { className: "container mx-auto px-6 text-center" },
              React.createElement("div", { className: "text-center" },
                React.createElement("h2", { className: "text-4xl font-bold font-display text-red-600 uppercase mb-2" }, "Наши хиты"),
                React.createElement("p", { className: "text-lg text-gray-400 mb-12 max-w-2xl mx-auto" }, "Четыре фаворита гостей Big Pizza: быстро раскупаются и всегда идеальны к любому настроению." )
              ),
              React.createElement("div", { className: "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-10" },
                signaturePizzas.map((pizza, index) =>
                  React.createElement(MenuItemCard, { key: `hit-${index}`, ...pizza, category: "Хиты", onAddToCart })
                )
              )
            )
          )
        );
      };

      const MenuCategories = ({ onAddToCart }) => {
        const [activeCategory, setActiveCategory] = useState(menuCategories[0].id);
        const currentCategory = menuCategories.find((category) => category.id === activeCategory) || menuCategories[0];

        return (
          React.createElement("section", { id: "menu", className: "py-20 bg-gray-800" },
            React.createElement("div", { className: "container mx-auto px-6" },
              React.createElement("div", { className: "text-center" },
                React.createElement("h2", { className: "text-4xl font-bold font-display text-red-600 uppercase mb-2" }, "Категории меню"),
                React.createElement("p", { className: "text-lg text-gray-400 mb-10 max-w-2xl mx-auto" }, "Выберите раздел, чтобы быстро собрать заказ. Все категории — под рукой, а карточки компактны и информативны." )
              ),
              React.createElement("div", { className: "flex flex-wrap justify-center gap-3 mb-12" },
                menuCategories.map((category) =>
                  React.createElement("button", {
                    key: category.id,
                    onClick: () => setActiveCategory(category.id),
                    className: `px-5 py-2 rounded-full border border-red-600 text-sm font-semibold uppercase transition-colors duration-300 ${activeCategory === category.id ? 'bg-red-600 text-white' : 'text-red-400 hover:bg-red-600/20'}`
                  }, category.title)
                )
              ),
              React.createElement("div", { className: "grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8" },
                currentCategory.items.map((item, index) =>
                  React.createElement(MenuItemCard, { key: `${currentCategory.id}-${index}`, ...item, category: currentCategory.title, onAddToCart })
                )
              )
            )
          )
        );
      };

      // --- Component: About ---
      const About = () => {
        return (
          React.createElement("section", { id: "about", className: "py-20 bg-gray-800" },
            React.createElement("div", { className: "container mx-auto px-6" },
              React.createElement("div", { className: "flex flex-col md:flex-row items-center gap-12" },
                React.createElement("div", { className: "md:w-1/2" },
                  React.createElement("img", {
                    src: "https://images.unsplash.com/photo-1574071318508-1cdbab80d002?q=80&w=1740&auto=format&fit=crop",
                    alt: "Интерьер пиццерии Big Pizza с печью",
                    className: "rounded-lg shadow-2xl w-full"
                  })
                ),
                React.createElement("div", { className: "md:w-1/2" },
                  React.createElement("h2", { className: "text-4xl font-bold font-display text-red-600 uppercase mb-4" }, "Наша история"),
                  React.createElement("p", { className: "text-gray-300 mb-4 leading-relaxed" },
                    "«Big Pizza» родилась из семейной страсти к аутентичной итальянской кухне. Мы начали с маленькой печи на заднем дворе, совершенствуя рецепт теста и подбирая идеальные сочетания начинок. Наша мечта была проста: делиться радостью от вкусной еды с нашими друзьями и соседями."
                  ),
                  React.createElement("p", { className: "text-gray-300 leading-relaxed" },
                    "Сегодня «Big Pizza» — это место, где традиции встречаются с качеством. Мы используем только лучшие местные продукты, свежие овощи и настоящий сыр моцарелла. Каждая пицца готовится вручную и выпекается в каменной печи, чтобы вы могли насладиться тем самым, неповторимым вкусом."
                  )
                )
              )
            )
          )
        );
      };
      
      // --- Component: Hero ---
      const Hero = () => {
        return (
          React.createElement("section", { id: "home", className: "relative h-screen flex items-center justify-center text-center text-white" },
            React.createElement("div", {
              className: "absolute top-0 left-0 w-full h-full bg-cover bg-center",
              style: { backgroundImage: "url('https://images.unsplash.com/photo-1513104890138-7c749659a591?q=80&w=1920&auto=format&fit=crop')" }
            }),
            React.createElement("div", { className: "absolute top-0 left-0 w-full h-full bg-black bg-opacity-60" }),
            React.createElement("div", { className: "relative z-10 p-6" },
              React.createElement("h1", { className: "text-5xl md:text-7xl lg:text-8xl font-bold font-display uppercase tracking-wider leading-tight mb-4" },
                "Каждый кусок — ", React.createElement("br", null),
                React.createElement("span", { className: "text-red-600" }, "большое"), " удовольствие"
              ),
              React.createElement("p", { className: "text-lg md:text-xl max-w-2xl mx-auto mb-8 text-gray-300" },
                "Настоящая итальянская пицца, приготовленная с любовью и только из свежих ингредиентов. Попробуйте раз, и вы вернетесь снова!"
              ),
              React.createElement("a", {
                href: "#menu",
                className: "bg-red-600 text-white font-bold font-display text-xl uppercase py-4 px-10 rounded-full hover:bg-red-700 transition-transform transform hover:scale-105 duration-300 shadow-lg"
              }, "Смотреть меню")
            )
          )
        );
      };

      // --- Component: Header ---
      const NavLink = ({ href, children, onClick }) => (
        React.createElement("a", {
          href: href,
          onClick: onClick,
          className: "block md:inline-block px-4 py-2 rounded-md text-lg text-gray-300 hover:text-white hover:bg-red-700 transition-colors duration-300"
        },
          children
        )
      );

      const Header = ({ cartCount = 0, onCartClick = () => {} }) => {
        const [isOpen, setIsOpen] = useState(false);
        const [isScrolled, setIsScrolled] = useState(false);

        const navLinks = [
          { href: '#hits', label: 'Хиты' },
          { href: '#menu', label: 'Меню' },
          { href: '#about', label: 'О нас' },
          { href: '#contact', label: 'Контакты' },
        ];

        useEffect(() => {
          const handleScroll = () => {
            setIsScrolled(window.scrollY > 10);
          };
          window.addEventListener('scroll', handleScroll);
          return () => {
            window.removeEventListener('scroll', handleScroll);
          };
        }, []);

        const toggleMenu = () => setIsOpen(!isOpen);
        const closeMenu = () => setIsOpen(false);

        return (
          React.createElement("header", { className: `sticky top-0 z-50 transition-all duration-300 ${isScrolled ? 'bg-gray-900/80 backdrop-blur-sm shadow-lg' : 'bg-transparent'}` },
            React.createElement("nav", { className: "container mx-auto px-6 py-3" },
              React.createElement("div", { className: "flex justify-between items-center" },
                React.createElement("a", { href: "#home", className: "text-3xl font-bold font-display text-white tracking-wider" },
                  "BIG ", React.createElement("span", { className: "text-red-600" }, "PIZZA")
                ),
                React.createElement("div", { className: "hidden md:flex items-center space-x-2" },
                  navLinks.map((link) => React.createElement(NavLink, { key: link.href, href: link.href, onClick: () => {} }, link.label)),
                  React.createElement("button", {
                    type: "button",
                    onClick: onCartClick,
                    className: "relative inline-flex items-center gap-2 bg-red-600 hover:bg-red-700 text-white font-display font-bold uppercase text-sm px-4 py-2 rounded-full transition-colors duration-300 shadow-lg"
                  },
                    React.createElement(CartIcon, null),
                    React.createElement("span", null, "Корзина"),
                    cartCount > 0 && React.createElement("span", { className: "absolute -top-2 -right-2 min-w-[1.75rem] h-7 px-2 flex items-center justify-center rounded-full bg-white text-gray-900 text-xs font-extrabold" }, cartCount)
                  )
                ),
                React.createElement("div", { className: "flex items-center gap-3 md:hidden" },
                  React.createElement("button", {
                    type: "button",
                    onClick: onCartClick,
                    className: "relative inline-flex items-center justify-center w-11 h-11 rounded-full bg-red-600 text-white shadow-lg hover:bg-red-700 transition-colors duration-300"
                  },
                    React.createElement(CartIcon, null),
                    cartCount > 0 && React.createElement("span", { className: "absolute -top-1.5 -right-1.5 w-6 h-6 rounded-full bg-white text-gray-900 text-xs font-extrabold flex items-center justify-center" }, cartCount)
                  ),
                  React.createElement("button", { onClick: toggleMenu, className: "text-white focus:outline-none" },
                    React.createElement("svg", { className: "w-8 h-8", fill: "none", stroke: "currentColor", viewBox: "0 0 24 24", xmlns: "http://www.w3.org/2000/svg" },
                      isOpen ?
                        React.createElement("path", { strokeLinecap: "round", strokeLinejoin: "round", strokeWidth: "2", d: "M6 18L18 6M6 6l12 12" }) :
                        React.createElement("path", { strokeLinecap: "round", strokeLinejoin: "round", strokeWidth: "2", d: "M4 6h16M4 12h16M4 18h16" })
                    )
                  )
                )
              ),
              isOpen && (
                React.createElement("div", { className: "md:hidden mt-4 bg-gray-800 rounded-lg" },
                  React.createElement("div", { className: "flex flex-col items-center space-y-2 py-2" },
                    navLinks.map((link) => React.createElement(NavLink, { key: link.href, href: link.href, onClick: closeMenu }, link.label)),
                    React.createElement("button", {
                      type: "button",
                      onClick: () => { closeMenu(); if (typeof onCartClick === 'function') { onCartClick(); } },
                      className: "w-[90%] flex items-center justify-center gap-2 bg-red-600 hover:bg-red-700 text-white font-display font-bold uppercase text-sm px-4 py-3 rounded-full transition-colors duration-300 shadow-lg"
                    },
                      React.createElement(CartIcon, null),
                      React.createElement("span", null, cartCount > 0 ? `Корзина (${cartCount})` : "Корзина")
                    )
                  )
                )
              )
            )
          )
        );
      };
      
      // --- Component: App ---
      const App = () => {
        const [cartItems, setCartItems] = useState([]);
        const [isCartOpen, setIsCartOpen] = useState(false);
        const [isToastVisible, setIsToastVisible] = useState(false);
        const [recentlyAddedItem, setRecentlyAddedItem] = useState("");

        const cartItemCount = cartItems.reduce((acc, item) => acc + item.quantity, 0);
        const cartTotalValue = cartItems.reduce((acc, item) => acc + item.priceValue * item.quantity, 0);
        const cartTotalLabel = currencyFormatter.format(cartTotalValue);

        const handleAddToCart = ({ name, price, imageUrl }) => {
          setCartItems((prevItems) => {
            const existingItem = prevItems.find((item) => item.name === name);

            if (existingItem) {
              return prevItems.map((item) =>
                item.name === name ? { ...item, quantity: item.quantity + 1 } : item
              );
            }

            return [
              ...prevItems,
              {
                name,
                priceLabel: price,
                priceValue: parsePriceValue(price),
                imageUrl,
                quantity: 1
              }
            ];
          });

          setRecentlyAddedItem(name);
          setIsToastVisible(true);
        };

        const updateItemQuantity = (itemName, delta) => {
          setCartItems((prevItems) => {
            return prevItems.reduce((acc, item) => {
              if (item.name !== itemName) {
                acc.push(item);
                return acc;
              }

              const updatedQuantity = item.quantity + delta;
              if (updatedQuantity > 0) {
                acc.push({ ...item, quantity: updatedQuantity });
              }

              return acc;
            }, []);
          });
        };

        const handleRemoveItem = (itemName) => {
          setCartItems((prevItems) => prevItems.filter((item) => item.name !== itemName));
        };

        useEffect(() => {
          if (!isToastVisible) {
            return;
          }

          const timer = setTimeout(() => {
            setIsToastVisible(false);
          }, 4000);

          return () => clearTimeout(timer);
        }, [isToastVisible]);

        const openCart = () => setIsCartOpen(true);
        const closeCart = () => setIsCartOpen(false);

        const handleViewCart = () => {
          openCart();
          setIsToastVisible(false);
        };

        const handleContinueShopping = () => {
          setIsToastVisible(false);
        };

        return (
          React.createElement("div", { className: "bg-gray-900 min-h-screen" },
            React.createElement(Header, { cartCount: cartItemCount, onCartClick: openCart }),
            React.createElement("main", null,
              React.createElement(Hero, null),
              React.createElement(MenuHits, { onAddToCart: handleAddToCart }),
              React.createElement(About, null),
              React.createElement(MenuCategories, { onAddToCart: handleAddToCart }),
              React.createElement(Contact, null)
            ),
            React.createElement(Footer, null),
            React.createElement(CartToast, {
              isVisible: isToastVisible,
              itemName: recentlyAddedItem,
              onViewCart: handleViewCart,
              onContinue: handleContinueShopping
            }),
            React.createElement(CartDrawer, {
              isOpen: isCartOpen,
              items: cartItems,
              total: cartTotalLabel,
              onClose: closeCart,
              onIncrease: (itemName) => updateItemQuantity(itemName, 1),
              onDecrease: (itemName) => updateItemQuantity(itemName, -1),
              onRemove: handleRemoveItem
            })
          )
        );
      };

      // --- Mount Application ---
      const rootElement = document.getElementById('root');
      if (!rootElement) {
        throw new Error("Could not find root element to mount to");
      }

      const root = ReactDOM.createRoot(rootElement);
      root.render(
        React.createElement(React.StrictMode, null,
          React.createElement(App, null)
        )
      );
    </script>
  </body>
</html>
