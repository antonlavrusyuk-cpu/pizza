              React.createElement("p", { className: "text-lg md:text-xl max-w-2xl mx-auto mb-8 text-gray-300" },
                "Настоящая итальянская пицца, приготовленная с любовью и только из свежих ингредиентов. Попробуйте раз, и вы вернетесь снова!"
              ),
              React.createElement("a", {
                href: "#menu",
                className: "bg-red-600 text-white font-bold font-display text-xl uppercase py-4 px-10 rounded-full hover:bg-red-700 transition-transform transform hover:scale-105 duration-300 shadow-lg"
              }, "Смотреть меню")
            )
          )
        );
      };

      // --- Component: Header ---
      const NavLink = ({ href, children, onClick }) => (
        React.createElement("a", {
          href: href,
          onClick: onClick,
          className: "block md:inline-block px-4 py-2 rounded-md text-lg text-gray-300 hover:text-white hover:bg-red-700 transition-colors duration-300"
        },
          children
        )
      );

      const Header = () => {
        const [isOpen, setIsOpen] = useState(false);
        const [isScrolled, setIsScrolled] = useState(false);

        const navLinks = [
          { href: '#hits', label: 'Хиты' },
          { href: '#menu', label: 'Меню' },
          { href: '#about', label: 'О нас' },
          { href: '#contact', label: 'Контакты' },
        ];

        useEffect(() => {
          const handleScroll = () => {
            setIsScrolled(window.scrollY > 10);
          };
          window.addEventListener('scroll', handleScroll);
          return () => {
            window.removeEventListener('scroll', handleScroll);
          };
        }, []);

        const toggleMenu = () => setIsOpen(!isOpen);
        const closeMenu = () => setIsOpen(false);

        return (
          React.createElement("header", { className: `sticky top-0 z-50 transition-all duration-300 ${isScrolled ? 'bg-gray-900/80 backdrop-blur-sm shadow-lg' : 'bg-transparent'}` },
            React.createElement("nav", { className: "container mx-auto px-6 py-3" },
              React.createElement("div", { className: "flex justify-between items-center" },
                React.createElement("a", { href: "#home", className: "text-3xl font-bold font-display text-white tracking-wider" },
                  "BIG ", React.createElement("span", { className: "text-red-600" }, "PIZZA")
                ),
                React.createElement("div", { className: "hidden md:flex items-center space-x-2" },
                  navLinks.map((link) => React.createElement(NavLink, { key: link.href, href: link.href, onClick: () => {} }, link.label))
                ),
                React.createElement("div", { className: "md:hidden" },
                  React.createElement("button", { onClick: toggleMenu, className: "text-white focus:outline-none" },
                    React.createElement("svg", { className: "w-8 h-8", fill: "none", stroke: "currentColor", viewBox: "0 0 24 24", xmlns: "http://www.w3.org/2000/svg" },
                      isOpen ?
                        React.createElement("path", { strokeLinecap: "round", strokeLinejoin: "round", strokeWidth: "2", d: "M6 18L18 6M6 6l12 12" }) :
                        React.createElement("path", { strokeLinecap: "round", strokeLinejoin: "round", strokeWidth: "2", d: "M4 6h16M4 12h16M4 18h16" })
                    )
                  )
                )
              ),
              isOpen && (
                React.createElement("div", { className: "md:hidden mt-4 bg-gray-800 rounded-lg" },
                  React.createElement("div", { className: "flex flex-col items-center space-y-2 py-2" },
                    navLinks.map((link) => React.createElement(NavLink, { key: link.href, href: link.href, onClick: closeMenu }, link.label))
                  )
                )
              )
            )
          )
        );
      };
      
      // --- Component: App ---
      const App = () => {
        return (
          React.createElement("div", { className: "bg-gray-900" },
            React.createElement(Header, null),
            React.createElement("main", null,
              React.createElement(Hero, null),
              React.createElement(MenuHits, null),
              React.createElement(About, null),
              React.createElement(MenuCategories, null),
              React.createElement(Contact, null)

            React.createElement(Footer, null)
          )
        );
      };

      // --- Mount Application ---
      const rootElement = document.getElementById('root');
      if (!rootElement) {

      const root = ReactDOM.createRoot(rootElement);
      root.render(
        React.createElement(React.StrictMode, null,
          React.createElement(App, null)
        )
      );
    </script>
  </body>
